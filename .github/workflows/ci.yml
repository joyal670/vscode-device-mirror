name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS matter: adb lookup and paths differ per OS, and
        # the tests run there natively.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch scrcpy server (SHA-256 checked)
        run: npm run fetch-server
      - run: npm run lint
      - run: npm test

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run fetch-server
      - run: npx vsce package --out device-mirror.vsix
      - name: Check the package contents
        shell: bash
        run: |
          files=$(npx vsce ls)
          echo "$files"
          for required in server/scrcpy-server.jar out/extension.js media/main.js; do
            grep -qx "$required" <<<"$files" || { echo "missing from package: $required"; exit 1; }
          done
          if grep -E '^(src/|out/test/|scripts/)' <<<"$files"; then
            echo "development files leaked into the package"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: device-mirror-vsix
          path: device-mirror.vsix
